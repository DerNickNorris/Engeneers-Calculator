[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ingrechner"
version = "0.8.0"
description = "Modularer Ingenieurs-Rechner (Maschinenbau, Statik, Elektro, Fluid) als Desktop-App"
requires-python = ">=3.11"
dependencies = [
    "PySide6>=6.6",
    "pint>=0.23",
    "numpy>=1.26",
    "matplotlib>=3.8",
    "reportlab>=4.0",
    "openpyxl>=3.1",
    "faster-whisper>=1.1",   # Offline-Diktat (optional: ohne Paket ist das Diktat deaktiviert)
]

[project.optional-dependencies]
dev = ["pytest>=8", "pyinstaller>=6.3"]

[project.gui-scripts]
ingrechner = "ingrechner.app:main"

[tool.setuptools.packages.find]
include = ["ingrechner*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
