name: Windows-Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write   # nur für das Release bei Versions-Tags benötigt

jobs:
  build:
    runs-on: windows-latest
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Abhängigkeiten installieren
        run: pip install -r requirements-dev.txt

      - name: Version ermitteln
        id: version
        shell: pwsh
        run: |
          $v = python -c "import ingrechner; print(ingrechner.__version__)"
          "version=$v" >> $env:GITHUB_OUTPUT
          Write-Host "Version: $v"
          if ($env:GITHUB_REF -like "refs/tags/v*" -and $env:GITHUB_REF_NAME -ne "v$v") {
            Write-Error "Tag $env:GITHUB_REF_NAME passt nicht zur Programmversion $v (ingrechner/__init__.py)."
            exit 1
          }

      - name: Tests
        run: python -m pytest -q

      - name: EXE bauen
        run: pyinstaller ingrechner.spec --noconfirm

      - name: Selbsttest der fertigen EXE
        shell: pwsh
        run: |
          $p = Start-Process -FilePath "dist\Ingenieurs-Rechner\Ingenieurs-Rechner.exe" `
               -ArgumentList "--selftest","--selftest-out=selftest.txt" -Wait -PassThru
          Get-Content selftest.txt
          if ($p.ExitCode -ne 0) { exit 1 }

      - name: Inno Setup bereitstellen
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress }
          if (-not (Test-Path $iscc)) { Write-Error "ISCC.exe nicht gefunden"; exit 1 }
          "ISCC=$iscc" >> $env:GITHUB_ENV

      - name: Installer bauen
        shell: pwsh
        run: |
          & $env:ISCC "/DAppVersion=${{ steps.version.outputs.version }}" installer\ingrechner.iss
          if ($LASTEXITCODE -ne 0) { exit 1 }
          Get-ChildItem dist\installer

      - name: Installer testen (still installieren, starten, deinstallieren)
        shell: pwsh
        run: |
          $setup = (Get-ChildItem dist\installer\*.exe | Select-Object -First 1).FullName
          $dir = Join-Path $env:RUNNER_TEMP "ir-installtest"
          $p = Start-Process $setup -ArgumentList "/VERYSILENT","/SUPPRESSMSGBOXES","/NORESTART","/CURRENTUSER",`
               "/DIR=`"$dir`"","/LOG=`"$env:RUNNER_TEMP\install.log`"" -Wait -PassThru
          if ($p.ExitCode -ne 0) { Get-Content "$env:RUNNER_TEMP\install.log"; exit 1 }
          $exe = Join-Path $dir "Ingenieurs-Rechner.exe"
          if (-not (Test-Path $exe)) { Write-Error "Programm wurde nicht installiert"; exit 1 }
          $p = Start-Process $exe -ArgumentList "--selftest","--selftest-out=$env:RUNNER_TEMP\st-installiert.txt" -Wait -PassThru
          Get-Content "$env:RUNNER_TEMP\st-installiert.txt"
          if ($p.ExitCode -ne 0) { exit 1 }
          foreach ($ext in ".irp", ".irpk") {
            $val = (Get-ItemProperty "HKCU:\Software\Classes\$ext").'(default)'
            Write-Host "Dateizuordnung $ext -> $val"
            if (-not $val) { Write-Error "Dateizuordnung $ext fehlt"; exit 1 }
          }
          $lnk = Join-Path ([Environment]::GetFolderPath("Programs")) "Ingenieurs-Rechner.lnk"
          if (-not (Test-Path $lnk)) { Write-Error "Startmenü-Eintrag fehlt"; exit 1 }
          Start-Process (Join-Path $dir "unins000.exe") -ArgumentList "/VERYSILENT","/SUPPRESSMSGBOXES","/NORESTART"
          for ($i = 0; $i -lt 60 -and (Test-Path $exe); $i++) { Start-Sleep -Seconds 1 }
          if (Test-Path $exe) { Write-Error "Deinstallation unvollständig"; exit 1 }
          if (Test-Path "HKCU:\Software\Classes\IngRechner.Projekt") { Write-Error "Registry-Reste nach Deinstallation"; exit 1 }
          Write-Host "Installation, Start, Dateizuordnung und Deinstallation erfolgreich."

      - name: Portable Version packen
        shell: pwsh
        run: Compress-Archive -Path dist\Ingenieurs-Rechner -DestinationPath "dist\Ingenieurs-Rechner-${{ steps.version.outputs.version }}-portable.zip"

      - name: Installer hochladen
        uses: actions/upload-artifact@v4
        with:
          name: Ingenieurs-Rechner-Setup
          path: dist/installer/*.exe

      - name: Portable Version hochladen
        uses: actions/upload-artifact@v4
        with:
          name: Ingenieurs-Rechner-windows
          path: dist/Ingenieurs-Rechner

      - name: GitHub-Release veröffentlichen
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = $env:GITHUB_REF_NAME
          $files = @((Get-ChildItem dist\installer\*.exe).FullName,
                     "dist\Ingenieurs-Rechner-${{ steps.version.outputs.version }}-portable.zip")
          # Wurde das Release vorher auf GitHub angelegt, nur die Dateien anhängen
          gh release view $tag *> $null
          if ($LASTEXITCODE -eq 0) {
            Write-Host "Release $tag existiert bereits – Dateien werden angehängt."
            gh release upload $tag @files --clobber
          } else {
            gh release create $tag @files --title "Ingenieurs-Rechner ${{ steps.version.outputs.version }}" --generate-notes
          }
          if ($LASTEXITCODE -ne 0) { exit 1 }
